<section class="session-chart" data-session-chart
         data-source="{{ selected_source }}" data-workspace="{{ selected_workspace if selected_workspace is not none else '' }}"
         data-list-page="{{ pagination.page }}" aria-label="세션 관측 시각 차트">
  <script type="application/json" data-chart-inventory>{{ chart_sessions | tojson }}</script>
  <script type="application/json" data-chart-pins>{{ pinned_sessions | default([]) | map(attribute='id') | list | tojson }}</script>
  <script type="application/json" data-chart-project-preference>{{ chart_project_preference | tojson }}</script>
  <div class="session-chart-fallback" data-chart-fallback>
    <p>시간 차트를 불러오지 못하면 List에서 모든 세션을 볼 수 있습니다.</p>
    <a class="secondary-button" href="{{ session_display_url('list') }}">List 열기</a>
  </div>
  {% if chart_sessions %}
    <div class="session-chart-explorer" data-chart-explorer hidden>
      <div class="session-chart-toolbar">
        <details class="session-chart-project-filter" data-chart-project-filter>
          <summary aria-controls="session-chart-project-options"><span data-chart-project-filter-label>프로젝트</span><span aria-hidden="true">▾</span></summary>
          <div class="session-chart-project-filter-panel">
            <input type="search" data-chart-project-search aria-label="프로젝트 검색" placeholder="프로젝트 검색">
            <label class="session-chart-project-choice session-chart-project-all"><input type="checkbox" data-chart-project-all checked><span>전체 선택</span></label>
            <div class="session-chart-project-options" id="session-chart-project-options" data-chart-project-options></div>
          </div>
        </details>
        <div class="session-chart-project-save-error" data-chart-project-save-error hidden>
          <span role="status" data-chart-project-save-message></span>
          <button class="secondary-button" type="button" data-chart-project-save-retry>다시 저장</button>
        </div>
        <div class="session-chart-actions" role="group" aria-label="차트 탐색">
          <button class="secondary-button" type="button" data-chart-action="zoom-out" aria-label="차트 축소">−</button>
          <button class="secondary-button" type="button" data-chart-action="zoom-in" aria-label="차트 확대">+</button>
          <button class="secondary-button" type="button" data-chart-action="fit">전체 보기</button>
          <button class="secondary-button" type="button" data-chart-action="focus" disabled>선택으로 이동</button>
        </div>
      </div>
      <div class="session-chart-stage">
        <div class="session-chart-viewport" data-chart-viewport tabindex="0" role="group"
             aria-label="실행 폴더와 기록된 브랜치의 세션 관측 차트">
          <div class="session-chart-axis" data-chart-axis aria-hidden="true"></div>
          <div class="session-chart-axis-corner" aria-hidden="true">프로젝트 A–Z</div>
          <div class="session-chart-project-axis" data-chart-project-axis aria-label="실행 폴더별 프로젝트와 브랜치"></div>
          <div class="session-chart-grid" data-chart-grid aria-hidden="true"></div>
          <svg class="session-chart-guides" data-chart-guides aria-hidden="true"></svg>
          <div class="session-chart-events" data-chart-events aria-label="선택 세션의 활동 시점"></div>
          <div class="session-chart-nodes" data-chart-nodes></div>
          <div class="session-chart-undated-empty" data-chart-undated-empty hidden>날짜를 확인할 수 있는 세션이 없습니다.</div>
        </div>
        <section class="session-chart-preview" id="session-chart-preview" data-chart-preview aria-label="선택한 세션" hidden>
          <div class="session-chart-preview-heading">
            <span data-chart-preview-source></span>
            <span class="session-chart-pin-status" data-chart-preview-pin hidden>
              <svg class="session-chart-pin-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Z"></path><path d="M12 14v7"></path></svg>
              <span>Pinned</span>
            </span>
            <button class="secondary-button" type="button" data-chart-close aria-label="선택 해제">×</button>
          </div>
          <h3 data-chart-preview-title></h3>
          <time data-chart-preview-time></time>
          <label class="session-chart-stack-selector" data-chart-stack-selector hidden>
            <span data-chart-stack-label></span>
            <select data-chart-stack-select aria-label="같은 위치의 세션 선택"></select>
          </label>
          <dl>
            <div><dt>실행 경로</dt><dd data-chart-preview-path></dd></div>
            <div data-chart-preview-branch-row><dt>기록된 브랜치</dt><dd data-chart-preview-branch></dd></div>
          </dl>
          <p class="session-chart-activity-status" data-chart-activity-status role="status"></p>
          <div class="session-chart-preview-actions">
            <button class="secondary-button" type="button" data-chart-activity>활동 시점 보기</button>
            <a class="primary-button" data-chart-detail>세션 상세 ↗</a>
          </div>
        </section>
      </div>
      <details class="session-chart-undated" data-chart-undated hidden>
        <summary data-chart-undated-summary></summary>
        <ul data-chart-undated-items></ul>
      </details>
      <p class="sr-only" role="status" data-chart-status></p>
    </div>
  {% else %}
    <div class="empty-state"><h3>조건에 맞는 세션이 없습니다</h3><p>다른 소스나 프로젝트 필터를 선택해 보세요.</p></div>
  {% endif %}
</section>
<script src="{{ url_for('static', path='/session-chart.js') }}?v={{ asset_version | default('dev') }}-19" defer></script>
