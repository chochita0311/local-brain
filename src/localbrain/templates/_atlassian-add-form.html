<div class="atlassian-add-content" data-atlassian-add-content>
  <p class="atlassian-action-copy">Jira 링크나 Project URL 또는 Wiki 문서나 Space URL 하나를 로컬 reference로 등록합니다. 이 단계는 원격 조회를 시작하지 않습니다.</p>
  {% if form_error %}<div id="atlassian-add-error" class="atlassian-feedback error" role="alert" tabindex="-1" data-atlassian-add-error>{{ form_error }}</div>{% endif %}
  <form class="atlassian-form atlassian-add-form" method="post" action="/atlassian/register" data-atlassian-add-form{% if form_error %} aria-describedby="atlassian-add-error"{% endif %}>
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <label for="atlassian-url">Atlassian URL <span aria-hidden="true">*</span></label>
    <input id="atlassian-url" name="url" type="url" required maxlength="8000" value="{{ form_state.get('url', '') }}" placeholder="https://jira.example.test/browse/PROJ-123"{% if form_error %} aria-invalid="true" aria-describedby="atlassian-add-error atlassian-url-help"{% else %} aria-describedby="atlassian-url-help"{% endif %}>
    <span id="atlassian-url-help" class="field-help">서비스와 도메인, 링크/문서 또는 Project/Space identity는 URL에서 로컬로 판별합니다.</span>
    <div class="atlassian-url-preview neutral" role="status" aria-live="polite" data-atlassian-url-preview>URL을 입력하면 인식된 Atlassian identity를 로컬에서 확인합니다.</div>
    <div class="atlassian-add-form-actions">
      <button class="primary-button" type="submit" data-atlassian-add-submit>로컬에 등록</button>
      <a class="secondary-button button-link" href="{{ return_to }}" data-atlassian-add-cancel>Cancel</a>
    </div>
  </form>
</div>
