{% macro icon(name, class_name='') -%}
<svg class="app-icon {{ class_name }}" viewBox="0 0 960 960" fill="currentColor" aria-hidden="true" focusable="false" data-icon="{{ name }}"><use href="{{ url_for('static', path='/icons/material-symbols.svg') }}?v={{ asset_version }}#{{ name }}"></use></svg>
{%- endmacro %}
