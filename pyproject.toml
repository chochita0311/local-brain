[project]
name = "localbrain"
version = "0.1.0"
description = "Local-first developer work context hub"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "latex2mathml>=3.77,<4",
  "markdown-it-py>=3,<4",
  "mdit-py-plugins>=0.4,<0.5",
  "pygments>=2.17,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
localbrain = "localbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localbrain"]
