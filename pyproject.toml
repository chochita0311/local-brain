[project]
name = "localbrain"
version = "0.1.0"
description = "Local-first developer work context hub"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128.8,<0.129",
  "jinja2>=3.1,<4",
  "latex2mathml>=3.77,<4",
  "markdown-it-py>=3,<4",
  "mdit-py-plugins>=0.4,<0.5",
  "pygments>=2.17,<3",
  "pyyaml>=6,<7",
  "tomli>=2.0,<3 ; python_full_version < '3.11'",
  "uvicorn[standard]>=0.39,<0.40",
]

[project.optional-dependencies]
local-models = [
  "torch>=2.8,<2.9 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.57,<4.58",
  "huggingface-hub>=0.36,<0.37",
  "sentence-transformers>=5.1,<5.2",
  "numpy>=1.26,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26,<3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "scikit-learn>=1.6,<1.7",
  "networkx>=3.2,<4",
]

[project.scripts]
localbrain = "localbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localbrain"]
