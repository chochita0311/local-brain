[package]
name = "localbrain-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
libc.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
candle-core = "=0.10.0"
candle-nn = "=0.10.0"
candle-transformers = "=0.10.0"
minijinja = { version = "=3.1.0", features = ["serde", "json", "builtins", "preserve_order"] }
minijinja-contrib = { version = "=3.1.0", features = ["pycompat"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = "=0.10.2"
candle-core = { version = "=0.10.0", features = ["metal", "accelerate"] }
candle-nn = { version = "=0.10.0", features = ["metal", "accelerate"] }
