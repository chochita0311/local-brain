[workspace]
members = ["crates/core", "crates/runtime", "crates/models", "apps/api"]
default-members = ["apps/api", "crates/core", "crates/runtime"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
libc = "=0.2.191"
rusqlite = { version = "=0.37.0", features = ["bundled", "backup", "functions", "serde_json", "hooks"] }
chrono = { version = "=0.4.45", features = ["serde"] }
jiff = { version = "=0.2.38", features = ["serde"] }
regex = "=1.13.1"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
base64 = "=0.22.1"
url = "=2.5.8"
tempfile = "=3.27.0"
sha1 = "=0.10.6"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
zstd = "=0.13.3"
walkdir = "=2.5.0"
rust_decimal = "=1.39.0"
unicode-normalization = "=0.1.21"
unicode-general-category = "=0.5.1"
pulldown-cmark = "=0.13.0"
markdown = "=1.0.0"
ammonia = "=4.1.2"
latex2mathml = "=0.2.3"
syntect = "=5.3.0"
shlex = "=1.3.0"
yaml-rust2 = "=0.13.0"
roxmltree = "=0.21.1"
fancy-regex = "=0.18.0"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
md-5 = "=0.10.6"
